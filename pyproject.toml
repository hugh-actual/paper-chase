[project]
name = "paper-chase"
version = "0.1.0"
description = "simple python scripts to organise a pdf collection"
requires-python = ">=3.14"
dependencies = [
    "pypdf>=4.0",
    "python-dotenv>=1.0.0",
]

[dependency-groups]
dev = [
    "black>=25.11.0",
    "flake8>=7.3.0",
    "pytest>=8.0",
]
